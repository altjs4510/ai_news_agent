name: 관련 학습 링크 (link-related)

# curate.yml 완료 후 자동 실행 — 관련 노트 링크 삽입.
# 수동 트리거도 지원.

on:
  workflow_run:
    workflows: ["Curate Blog (LLM-managed categories)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  link:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: weekly-ai-news    # 동일 그룹 → curate.yml과 직렬
      cancel-in-progress: false
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4

      - name: Checkout blog (with push token)
        uses: actions/checkout@v4
        with:
          repository: altjs4510/ai_news_blog
          token: ${{ secrets.BLOG_PUSH_TOKEN }}
          path: ai_news_blog_repo
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.13 and dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Configure git author for blog commits
        run: |
          git -C ai_news_blog_repo config user.email "altjs4510@gmail.com"
          git -C ai_news_blog_repo config user.name "cookie (link-bot)"

      - name: Run link-related
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_REPO_PATH: ${{ github.workspace }}/ai_news_blog_repo
        run: uv run python link_related.py

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: *관련 링크 삽입 실패*\\n<${RUN_URL}|workflow run 보기>\"}" \
            "$SLACK_WEBHOOK_URL"
