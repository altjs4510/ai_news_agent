name: Weekly AI News Digest

on:
  schedule:
    # 매주 일요일 21:00 UTC = 매주 월요일 06:00 KST
    - cron: "0 21 * * 0"
  workflow_dispatch:  # 수동 트리거 허용

permissions:
  contents: write   # reports-cache 브랜치 force-push에 필요

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: weekly-ai-news
      cancel-in-progress: false
    steps:
      - name: Checkout agent
        uses: actions/checkout@v6

      - name: Checkout blog (with push token)
        uses: actions/checkout@v6
        with:
          repository: altjs4510/ai_news_blog
          token: ${{ secrets.BLOG_PUSH_TOKEN }}
          path: ai_news_blog_repo
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.13 and dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Configure git author for blog commits
        run: |
          git -C ai_news_blog_repo config user.email "altjs4510@gmail.com"
          git -C ai_news_blog_repo config user.name "cookie"

      - name: Run agent (collect → summarize → publish weekly)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          BLOG_REPO_PATH: ${{ github.workspace }}/ai_news_blog_repo
          BLOG_SITE_URL: https://altjs4510.github.io/ai_news_blog
        run: uv run python main.py --mode weekly

      # 마지막 수집 결과만 reports-cache 브랜치(orphan)로 강제 푸시.
      - name: Snapshot latest reports/<date> to reports-cache branch
        if: success()
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(ls -1d reports/[0-9]* 2>/dev/null | sort | tail -1 || true)
          if [ -z "${latest:-}" ]; then
            echo "No reports/<date>/ to snapshot"
            exit 0
          fi
          echo "Snapshotting $latest"
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/reports"
          cp -R "$latest" "$tmp/reports/"
          cd "$tmp"
          git init -q -b reports-cache
          git -c user.email=bot@noreply.github.com -c user.name="reports-cache bot" \
              add -A
          git -c user.email=bot@noreply.github.com -c user.name="reports-cache bot" \
              commit -q -m "snapshot ${latest##*/}"
          git push -q -f "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" \
                  reports-cache:reports-cache

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COST_LINE="$(uv run python -m utils.anthropic_cost 2>/dev/null || echo '사용 비용: (조회 실패)')"
          export COST_LINE
          payload=$(python3 -c 'import json,os; text=":x: *AI News Weekly 수집 실패*\n<"+os.environ["RUN_URL"]+"|workflow run 보기>\n"+os.environ["COST_LINE"]; print(json.dumps({"text": text}))')
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
