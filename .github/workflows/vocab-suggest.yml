name: Vocabulary 진화 제안 (monthly)

# 매월 1일 Opus가 누적 분포를 분석해 GitHub Issue로 진화안 제안.
# 사람이 검토 후 동의하면 main.py CATEGORY_VOCABULARY 편집 → curate.yml 재분류.

on:
  # ⚠️ 스케줄 비활성 — LLM 백엔드가 F&F LiteLLM 사내망 프록시로 이관(공용 러너 도달 불가).
  # 월간 실행은 로컬 launchd 로 이관: com.cookie.ainews.vocab → run_pipeline.sh vocab
  #   (매월 1일 11:00 KST). CLAUDE.md 참조.
  # schedule:
  #   - cron: "0 2 1 * *"   # (구) 매월 1일 11:00 KST
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유"
        required: false
        default: "manual"

permissions:
  issues: write    # gh issue create 권한
  contents: read

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout agent
        uses: actions/checkout@v6

      - name: Checkout blog (read-only)
        uses: actions/checkout@v6
        with:
          repository: altjs4510/ai_news_blog
          token: ${{ secrets.BLOG_PUSH_TOKEN }}
          path: ai_news_blog_repo
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.13 and dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Run vocabulary suggestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_BEDROCK: ${{ secrets.USE_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          BLOG_REPO_PATH: ${{ github.workspace }}/ai_news_blog_repo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python vocab_suggest.py

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          USE_BEDROCK: ${{ secrets.USE_BEDROCK }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COST_LINE="$(uv run python -m utils.anthropic_cost 2>/dev/null || echo '사용 비용: (조회 실패)')"
          export COST_LINE
          payload=$(python3 -c 'import json,os; text=":x: *Vocabulary 제안 실패*\n<"+os.environ["RUN_URL"]+"|workflow run 보기>\n"+os.environ["COST_LINE"]; print(json.dumps({"text": text}))')
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
