name: Bedrock Model Discovery (one-off)

# Bedrock에서 사용 가능한 Anthropic 모델/inference profile ID 식별용 일회성 워크플로.
# utils/llm_client.py의 _BEDROCK_DEFAULTS 수정 후 삭제 가능.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: |
          uv python install 3.13
          uv sync

      - name: List Bedrock models
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: uv run python scripts/list_bedrock_models.py
