name: AI News 품질 모니터 (quality-monitor)

# daily.yml 성공 직후 자동 실행 + 수동 트리거.
# 이상 감지 시 Slack 알림.

on:
  # ⚠️ 자동 체인 비활성 — 로컬 run_pipeline.sh 가 daily 뒤 quality-monitor 실행.
  # (LLM 미사용이지만 트리거였던 Actions daily 가 로컬로 이관됨.) CLAUDE.md 참조.
  # workflow_run:
  #   workflows: ["Daily AI News Digest"]
  #   types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  monitor:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout agent
        uses: actions/checkout@v6

      - name: Checkout blog (read-only)
        uses: actions/checkout@v6
        with:
          repository: altjs4510/ai_news_blog
          token: ${{ secrets.BLOG_PUSH_TOKEN }}
          path: ai_news_blog_repo
          fetch-depth: 1

      - name: Fetch latest reports snapshot (reports-cache branch)
        run: |
          git fetch origin reports-cache 2>/dev/null \
            && git checkout origin/reports-cache -- reports/ 2>/dev/null \
            || echo "reports-cache 브랜치 없음 — URL/토픽 검사 스킵"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.13 and dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Run quality monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BLOG_REPO_PATH: ${{ github.workspace }}/ai_news_blog_repo
          REPORTS_DIR: ${{ github.workspace }}/reports
        run: uv run python quality_monitor.py

      - name: Notify Slack on script failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          USE_BEDROCK: ${{ secrets.USE_BEDROCK }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COST_LINE="$(uv run python -m utils.anthropic_cost 2>/dev/null || echo '사용 비용: (조회 실패)')"
          export COST_LINE
          payload=$(python3 -c 'import json,os; text=":x: *품질 모니터 실패*\n<"+os.environ["RUN_URL"]+"|workflow run 보기>\n"+os.environ["COST_LINE"]; print(json.dumps({"text": text}))')
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
